<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <title>Close</title>
    <style>
        html,
        body {
            margin: 0;
            height: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 12px;
            font-family: Arial, sans-serif;
            background: #ffffff;
        }
        button {
            padding: 10px 24px;
            font-size: 16px;
            border: none;
            border-radius: 4px;
            background: #0d6efd;
            color: #fff;
            cursor: pointer;
            min-width: 240px;
        }
        button:hover {
            background: #0b5ed7;
        }
    </style>
</head>
<body>
    <button id="close-btn">Close</button>
    <button id="close-redirect-btn">Close + Redirect (internal CLM)</button>
    <button id="close-redirect-btn-3">Close + Redirect (internal CPQ)</button>
    <button id="close-redirect-btn-2">Close + Redirect (internal New tab with dynamic Id)</button>
    <button id="close-redirect-external-btn">Close + Redirect (external, new tab)</button>
    <button id="close-refresh-btn">Close + Refresh</button>
    <script>
        function postCloseMessage(action, params) {
            window.parent.postMessage(
                {
                    type: 'ccl-custom-code-modal-close',
                    action: action,
                    params: params,
                },
                '*'
            );
        }

        document.getElementById('close-btn').addEventListener('click', function () {
            postCloseMessage();
        });

        document.getElementById('close-redirect-btn').addEventListener('click', function () {
            postCloseMessage('navigate', 'url:/clm/detail/{recordId}');
        });

        document.getElementById('close-redirect-btn-2').addEventListener('click', function () {
            postCloseMessage('navigate', 'url:/clm/detail/{recordId},target:_blank');
        });

        document.getElementById('close-redirect-btn-3').addEventListener('click', function () {
            postCloseMessage('navigate', 'url:/cpq/quotes/{recordId}');
        });

        document.getElementById('close-redirect-external-btn').addEventListener('click', function () {
            postCloseMessage('navigate', 'url:https://example.com,target:_blank');
        });

        

        document.getElementById('close-refresh-btn').addEventListener('click', function () {
            postCloseMessage('refresh');
        });
    </script>
</body>
</html>
