<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Request Legal Review</title>
<style>
  :root {
    --navy: #0b1f4b;
    --blue: #1f6feb;
    --blue-dark: #1757bd;
    --line: #d9dee8;
    --bg: #f5f7fb;
    --text: #1c2433;
    --muted: #5b6577;
    --ok: #16794c;
  }
  * { box-sizing: border-box; }
  body { margin: 0; font: 14px/1.45 -apple-system, "Segoe UI", Roboto, Arial, sans-serif; color: var(--text); background: var(--bg); }
  .wrap { max-width: 640px; margin: 0 auto; padding: 20px 24px 96px; }
  h1 { font-size: 18px; margin: 0 0 4px; color: var(--navy); }
  .sub { color: var(--muted); margin: 0 0 18px; }
  .card { background: #fff; border: 1px solid var(--line); border-radius: 8px; padding: 18px; }
  .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
  .full { grid-column: 1 / -1; }
  label { display: block; font-weight: 600; margin-bottom: 4px; font-size: 13px; }
  input, select, textarea { width: 100%; padding: 8px 10px; border: 1px solid var(--line); border-radius: 6px; font: inherit; background: #fff; }
  input[readonly] { background: #eef1f6; color: var(--muted); }
  input:focus, select:focus, textarea:focus { outline: 2px solid var(--blue); outline-offset: -1px; }
  textarea { min-height: 76px; resize: vertical; }
  .err { color: #b42318; font-size: 12px; margin-top: 3px; min-height: 14px; }
  .footer { position: fixed; left: 0; right: 0; bottom: 0; background: #fff; border-top: 1px solid var(--line); padding: 12px 24px; display: flex; gap: 10px; justify-content: flex-end; flex-wrap: wrap; }
  button { font: inherit; font-weight: 600; padding: 9px 16px; border-radius: 6px; cursor: pointer; border: 1px solid var(--line); background: #fff; color: var(--text); }
  button:hover { background: #f0f3f9; }
  button.primary { background: var(--blue); border-color: var(--blue); color: #fff; }
  button.primary:hover { background: var(--blue-dark); }
  button.secondary { border-color: var(--blue); color: var(--blue); }
  .status { margin-top: 14px; padding: 10px 12px; border-radius: 6px; background: #e8f5ee; color: var(--ok); display: none; font-weight: 600; }
  .debug { margin-top: 14px; font: 12px/1.4 Consolas, monospace; background: #101828; color: #c9d4ea; border-radius: 6px; padding: 10px 12px; display: none; white-space: pre-wrap; }
</style>
</head>
<body>
<div class="wrap">
  <h1>Request Legal Review</h1>
  <p class="sub">Send this agreement to Legal for review before it goes out for signature.</p>

  <form class="card" id="f" novalidate>
    <div class="grid">
      <div>
        <label for="disc">Review Due (days)</label>
        <input id="disc" type="number" min="1" max="30" value="5">
      </div>
      <div>
        <label for="appr">Reviewer</label>
        <select id="appr">
          <option>Legal Counsel</option>
          <option>Contracts Manager</option>
          <option>Compliance Officer</option>
        </select>
      </div>
      <div>
        <label for="prio">Priority</label>
        <select id="prio"><option>Normal</option><option>High</option><option>Urgent</option></select>
      </div>
      <div class="full">
        <label for="why">Notes for Reviewer</label>
        <textarea id="why" placeholder="Which clauses or changes need attention?"></textarea>      </div>
    </div>
    <div class="status" id="status"></div>
  </form>

  <div class="debug" id="debug"></div>
</div>

<div class="footer">
  <!-- 1. close only -->
  <button type="button" id="cancel">Cancel</button>
  <!-- 2. close + refresh host page -->
  <button type="button" class="secondary" id="save">Save Draft &amp; Refresh</button>
  <!-- 3. close + navigate -->
  <button type="button" class="primary" id="submit">Submit &amp; Open Document</button>
</div>

<script>
  var TYPE = 'ccl-custom-code-modal-close';
  var inIframe = window.parent !== window;
  var debugEl = document.getElementById('debug');
  var statusEl = document.getElementById('status');

  // {recordId} is sent as-is; the host replaces it with the current record's ID.
  // Shows the user what happened, then sends the message after a short beat
  // so the audience can see the page before the modal closes.
  function send(action, params, label) {
    var msg = { type: TYPE, action: action, params: params };
    statusEl.style.display = 'block';
    statusEl.textContent = label;
    if (!inIframe) {
      debugEl.style.display = 'block';
      debugEl.textContent = '(opened standalone, not in the CCL modal)\npostMessage → ' + JSON.stringify(msg, null, 2);
    }
    setTimeout(function () { window.parent.postMessage(msg, '*'); }, 900);
  }

  document.getElementById('cancel').onclick = function () {
    send(undefined, undefined, 'Closing without changes…');
  };

  document.getElementById('save').onclick = function () {
    send('refresh', undefined, 'Draft saved. Refreshing the agreement…');
  };

  document.getElementById('submit').onclick = function () {
    send('navigate', 'url:/clm/detail/{recordId}/documents/', 'Sent to Legal. Opening the Documents…');
  };
</script>
</body>
</html>
